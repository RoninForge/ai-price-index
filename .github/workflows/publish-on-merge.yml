name: publish-on-merge

# Fires when a human merges an approved price record (a push to main that touches
# data/records/**). One human action - merging the PR - flows fully automatically
# from here to a tagged dataset release and a notification to the downstream
# consumers (BudgetClaw + Goei).
#
# Steps:
#   1. SSH to the VPS system of record and run the existing export-and-publish.sh.
#      That script pulls the merged record, re-seeds the bitemporal DB, re-exports
#      the static artifacts, and - ONLY if the published data actually changed -
#      commits + pushes + creates the tag v<date>-<sha>.
#   2. Capture the new tag from the script's machine-readable sentinel line
#      (PUBLISHED_TAG=<tag>). If the merge did not change published prices the
#      script never prints that line, and this workflow exits 0 quietly.
#   3. If a tag was published, fire repository_dispatch to both consumer repos.
#
# No loop: export-and-publish.sh's commit only touches data/ai-price-index/**, never
# data/records/**, so the export push does NOT re-trigger this workflow.
#
# Requires secrets:
#   VPS_SSH_KEY            private key with access to the VPS (the agentuser/root login)
#   VPS_HOST              (optional, defaults to 204.168.172.83)
#   VPS_USER              (optional, defaults to root)
#   CONSUMER_DISPATCH_TOKEN  fine-grained PAT able to fire repository_dispatch on
#                            RoninForge/budgetclaw + RoninForge/goei-web + RoninForge/platform

on:
  push:
    branches: [main]
    paths:
      - 'data/records/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-on-merge
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - name: Run export-and-publish.sh on the VPS
        id: publish
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu

          if [ -z "${VPS_SSH_KEY:-}" ]; then
            echo "::error::VPS_SSH_KEY secret is not set."
            exit 1
          fi

          host="${VPS_HOST:-204.168.172.83}"
          user="${VPS_USER:-root}"

          # Write the key to a file with locked-down perms and pin the host key.
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$host" >> ~/.ssh/known_hosts 2>/dev/null

          # Run the existing publish script. Capture stdout so we can read the sentinel.
          # The script is idempotent and dash-safe; it no-ops when nothing changed.
          ssh -i ~/.ssh/vps_key -o IdentitiesOnly=yes "${user}@${host}" \
            'sh /home/agentuser/ai-price-index/tools/db/export-and-publish.sh' \
            | tee publish-output.txt

          # Extract the published tag, if any. No PUBLISHED_TAG line means no data change.
          tag="$(grep '^PUBLISHED_TAG=' publish-output.txt | tail -n1 | cut -d= -f2- || true)"
          if [ -z "$tag" ]; then
            echo "No PUBLISHED_TAG line; the merge did not change published prices. Exiting quietly."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Published tag: $tag"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Sign the interval-history bundle. Runs BEFORE the consumers are notified so a
  # consumer that vendors the bundle always finds a matching signature already on
  # main; see the ordering note below.
  #
  # The signing key lives ONLY in this repository's secrets and never on the VPS.
  # The VPS terminates TLS with a valid certificate, so TLS proves bytes came from
  # that host, not that they are genuine: a host that both serves and signs the
  # data would emit perfectly valid signatures after a single-box compromise, and
  # signing would buy nothing. Held here, forging price data requires the same
  # compromise that already yields a malicious consumer binary.
  #
  # ORDERING: a detached signature cannot exist before the bytes it signs, and the
  # release tag is created by the VPS export. So the bundle ships inside the tag
  # and its signature is committed to main immediately afterwards. Consumers serve
  # the bundle from the pinned tag and the signature from main, which are in step
  # because this job gates the dispatch. Any mismatch is a verification failure at
  # the client, which then keeps its compiled-in table: fail-safe, never wrong.
  #
  # This push touches data/ai-price-index/** only, and this workflow triggers on
  # data/records/**, so it cannot re-trigger itself.
  # Signing is implemented once, in sign-history.yml, and CALLED here rather
  # than duplicated. That workflow also runs on any push touching the bundle
  # and on a daily schedule, which covers the VPS cron export path that this
  # workflow never sees. Calling it here adds the ordering guarantee the
  # notify job below depends on: signed before consumers are told.
  sign-history:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    # A called workflow can only narrow the caller's token, never widen it,
    # and this workflow declares `contents: read` at the top. Without this
    # the signature commit would fail with a 403.
    permissions:
      contents: write
    uses: ./.github/workflows/sign-history.yml
    secrets: inherit

  notify:
    needs: [publish, sign-history]
    # always() is deliberate: this job WAITS FOR signing, so the ordering above
    # holds, but is not BLOCKED BY it. Propagating a price change is this
    # pipeline's primary duty and must not hinge on an add-on for an opt-in
    # client feature. If signing failed, the served signature is merely stale
    # and clients keep their compiled-in table, which is the designed fail-safe.
    if: always() && needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Notify downstream consumers
        env:
          CONSUMER_DISPATCH_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          set -eu

          if [ -z "${CONSUMER_DISPATCH_TOKEN:-}" ]; then
            echo "::error::CONSUMER_DISPATCH_TOKEN secret is not set; cannot notify consumers."
            exit 1
          fi

          payload=$(jq -nc --arg tag "$TAG" \
            '{event_type: "ai-price-index-release", client_payload: {tag: $tag}}')

          for repo in RoninForge/budgetclaw RoninForge/goei-web RoninForge/platform; do
            echo "Dispatching ai-price-index-release ($TAG) to $repo"
            code=$(curl -sS -o /tmp/dispatch-resp.txt -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $CONSUMER_DISPATCH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${repo}/dispatches" \
              -d "$payload")
            if [ "$code" != "204" ]; then
              echo "::error::Dispatch to $repo failed with HTTP $code"
              cat /tmp/dispatch-resp.txt
              exit 1
            fi
            echo "Dispatch to $repo accepted (HTTP 204)."
          done

  # Auto-publish the npm package on every real dataset release. Independent of the consumer dispatch:
  # if this fails, the dataset release + the dispatches already succeeded (visible as a partial run).
  # Each dataset release => one npm PATCH bump (version is registry-driven, not committed in-repo).
  #
  # Auth: npm Trusted Publishing (GitHub OIDC), no stored token. Configure a Trusted Publisher for the
  # `ai-price-index` package on npmjs.com pointing at RoninForge/ai-price-index and this workflow file
  # (publish-on-merge.yml). The job already requests id-token: write and upgrades npm for OIDC publishing.
  publish-npm:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance via OIDC
    env:
      TAG: ${{ needs.publish.outputs.tag }}
    steps:
      - name: Validate the release tag format
        # $TAG is a machine-generated v<date>-<sha> tag from our own VPS, but validate before it ever
        # reaches a checkout ref. Fail the job (so the later checkout never runs) on anything unexpected.
        run: |
          set -eu
          case "$TAG" in
            v[0-9]*) echo "Release tag: $TAG" ;;
            *) echo "::error::Unexpected release tag format: $TAG"; exit 1 ;;
          esac

      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.publish.outputs.tag }}
          fetch-depth: 0 # tags + history, so build-npm.mjs can stamp the bundle provenance

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) requires npm >= 11.5.1; the bundled npm may be older.
      - run: npm install -g npm@latest

      - name: Build the inline bundle and publish to npm
        run: |
          set -eu

          node tools/build-npm.mjs

          # Registry-driven version: bump the patch of the currently-published version, or fall back to
          # the package.json floor on the very first publish. Keeps versions monotonic without committing
          # a bump back to the repo (the VPS export already pushed the data commit for this release).
          published="$(npm view ai-price-index version 2>/dev/null || true)"
          if [ -n "$published" ]; then
            next="$(node -e 'const v=process.argv[1].split("."); v[2]=String((+v[2]||0)+1); console.log(v.join("."))' "$published")"
          else
            next="$(node -p "require('./package.json').version")"
          fi

          echo "Publishing ai-price-index@$next (dataset $TAG, was ${published:-unpublished})"
          npm version "$next" --no-git-tag-version --allow-same-version
          npm publish --provenance --access public
